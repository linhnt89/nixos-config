# Dependabot version updates for MetaCube.
#
# One targeted PR per dependency. Eligible bot PRs (author dependabot[bot],
# base = default branch, this repo) are squash-auto-merged by GitHub via
# .github/workflows/dependabot-auto-merge.yml; with no required checks they
# may merge promptly, so machine verification happens after merge (see
# docs/updates-runbook.md). CI (workflow_dispatch only) is an optional
# fallback, not a required check. No scheduled workflow opens PRs -
# Dependabot is the only bot here.
#
# What Dependabot does NOT cover (kept manual on purpose):
#   - nixpkgs-unstable: excluded from the stable-lane group so the Pi
#     lane still moves deliberately. Its individual PRs are subject to
#     the same auto-merge as every other eligible bot PR; deliberate
#     movement is enforced by the Dependabot schedule, not by review.
#
# Shared Firstmate toolchain pins (no-mistakes, herdr, treehouse, the
# axi CLIs) are nixdev-config-owned since the firstmateTools refactor;
# their Dependabot coverage lives in linhnt89/nixdev-config, not here.
version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nix"
    groups:
      # The coherent stable family moves as one PR: updating nixpkgs
      # cascades to home-manager (follows), so their revisions must
      # stay consistent in the same diff.
      stable-lane:
        patterns:
          - "nixpkgs"
          - "home-manager"
        exclude-patterns:
          - "nixpkgs-unstable"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"